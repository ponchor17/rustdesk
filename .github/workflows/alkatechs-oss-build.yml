# ALKATECHS attended-support pilot: native Windows x64 only.
# Pushing this workflow to the dedicated branch starts a single build.
# GitHub UI manual Run workflow requires workflow on default branch,
# so push is the reliable trigger until the dispatcher is merged.
name: ALKATECHS Windows x64 pilot
on:
  push:
    branches: [alkatechs-windows]
    paths:
      - .github/workflows/alkatechs-oss-build.yml
      - .github/workflows/alkatechs-windows-reusable.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  windows-x64:
    uses: ./.github/workflows/alkatechs-windows-reusable.yml
    permissions:
      contents: read
      actions: write
    with:
      upload-artifact: true
      upload-tag: alkatechs-oss-pilot
      publish-update-metadata: false
    secrets: inherit
